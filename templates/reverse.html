<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse</title>
</head>
<body>
    <form action="/reverse" method="POST">
        <input type="text" name="word">
        <input type="submit" value="Submit">
    </form>
    {{if .Result}}
        <p>Reversed: {{.Result}}</p>
    {{end}}
    {{if .Error}}
        <p>{{.Error}}</p>
    {{end}}
</body>
</html>
