<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascii-Art-Web</title>
</head>

<body>
    <h1>ASCII Art Generator</h1>

    {{if not .Result}}
    <form action="/ascii-art" method="post">
            <textarea name="text">{{.Text}}</textarea>
            <select name="banner">
                <option value="standard"  >Standard</option>
                <option value="shadow"    >Shadow</option>
                <option value="thinkertoy">Thinkertoy</option>
            </select>
        <input type="submit" value="Generate Art">
    </form>
    {{end}}

    {{if .Result}}
    <pre>{{.Result}}</pre>

    <span>Switch Banner:</span>
    <a href="/ascii-art-switch?text={{.Text}}&banner=standard">Standard</a>
    <a href="/ascii-art-switch?text={{.Text}}&banner=shadow">Shadow</a>
    <a href="/ascii-art-switch?text={{.Text}}&banner=thinkertoy">Thinkertoy</a>
    <br>
    <a href="/">Home</a>
    {{end}}
</body>

</html>
