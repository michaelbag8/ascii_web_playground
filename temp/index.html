<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List All Books</title>
</head>
<body>
    <h1>Books</h1>
     {{if .}}
    <ul>
        {{range .}}
        <li>{{.Title}} - {{.Author}}</li>
        {{end}}
    </ul>
    {{else}}
        <p>No Books Available</p>
    {{end}}
</body>
</html>
